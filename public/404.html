<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>LANDSRAAD // Redirection Holosphérique</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var isGithubIo = window.location.hostname.endsWith('github.io');
        var basePath = (isGithubIo && parts.length > 0) ? '/' + parts[0] + '/' : '/';
        window.location.replace(basePath);
      })();
    </script>
  </head>
  <body style="background:#060709;color:#d4af37;font-family:sans-serif;padding:2rem;text-align:center;">
    <p>Redirection vers la cartographie tactique du Landsraad...</p>
  </body>
</html>
