    <script>
      (function() {
        // Détection de l'hébergement statique GitHub Pages non-compilé
        window.addEventListener('DOMContentLoaded', function() {
          var uncompiledScript = document.querySelector('script[src*="main.tsx"]');
          var isGithubPages = window.location.hostname.endsWith('github.io');
          if (uncompiledScript && isGithubPages) {
            var segments = window.location.pathname.split('/').filter(Boolean);
            var repo = segments.length > 0 ? '/' + segments[0] : '';
            var target = repo + '/docs/' + window.location.search + window.location.hash;
            console.warn('[Landsraad] Hébergement GitHub Pages racine non-compilé détecté. Redirection vers /docs/ :', target);
            window.location.replace(target);
          }
        });
      })();
    </script>
